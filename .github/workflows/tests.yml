name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.11"

      - name: Install package
        run: python -m pip install -e '.[dev]'

      - name: Check whitespace
        run: git diff --check

      - name: Run security check
        run: python scripts/security_check.py

      - name: Run tests
        run: python -m pytest -q

      - name: Run eval smoke
        run: skill-agent eval --suite evals/capgap_smoke.jsonl --skills-dir skills --runs-dir runs/evals

      - name: Run lifecycle eval
        run: skill-agent eval --suite evals/skill_lifecycle_v0.jsonl --skills-dir skills --runs-dir runs/evals

      - name: Run agent diagnostic eval
        run: skill-agent eval --suite evals/agent_diagnostic_v0.jsonl --skills-dir skills --runs-dir runs/evals

      - name: Run v1 release eval
        run: skill-agent eval --suite evals/v1_release.jsonl --skills-dir skills --runs-dir runs/evals

      - name: Compile app
        run: python -m compileall -q app

      - name: Run v1 smoke
        run: bash scripts/v1_smoke.sh
